<DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArtRede - Comunidade de Desenho</title>
    <style>
        /* ESTILOS (CSS) */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #1e1e1e;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
        }
        header h1 {
            margin: 0;
            color: #ff6b6b;
            font-size: 24px;
        }
        .container {
            max-width: 800px;
            margin: 20px auto;
            padding: 0 15px;
        }
        /* Área de Desenho (Canvas) */
        .estudo-criacao {
            background-color: #1e1e1e;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 30px;
            text-align: center;
        }
        canvas {
            background-color: #ffffff;
            border-radius: 8px;
            cursor: crosshair;
            display: block;
            margin: 15px auto;
            max-width: 100%;
        }
        .controles {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        button, input[type="color"] {
            padding: 10px 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-postar {
            background-color: #ff6b6b;
            color: white;
        }
        .btn-limpar {
            background-color: #444;
            color: white;
        }
        /* Feed de Desenhos */
        .feed {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
        }
        .card-arte {
            background-color: #1e1e1e;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid #333;
        }
        .card-arte img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            background-color: #fff;
        }
        .card-info {
            padding: 15px;
        }
        .card-info h3 {
            margin: 0 0 5px 0;
            font-size: 16px;
        }
        .card-info p {
            margin: 0 0 10px 0;
            font-size: 13px;
            color: #aaa;
        }
        .btn-like {
            background-color: #2c2c2c;
            color: #ff6b6b;
            width: 100%;
        }
        .btn-like:hover {
            background-color: #3a3a3a;
        }
    </style>
</head>
<body>

    <!-- CABEÇALHO -->
    <header>
        <h1>🎨 ArtRede</h1>
        <span>Bem-vindo, Artista!</span>
    </header>

    <div class="container">
        
        <!-- ESTÚDIO DE DESENHO RÁPIDO -->
        <section class="estudo-criacao">
            <h2>Crie e poste seu desenho</h2>
            <canvas id="quadro" width="500" height="300"></canvas>
            <div class="controles">
                <input type="color" id="corPincel" value="#000000" title="Escolha a cor">
                <button class="btn-limpar" onclick="limparQuadro()">Limpar Tela</button>
                <button class="btn-postar" onclick="postarDesenho()">Publicar no Feed</button>
            </div>
        </section>

        <!-- FEED DA COMUNIDADE -->
        <h2>Galeria da Comunidade</h2>
        <main class="feed" id="feedArtes">
            <!-- Exemplo de Postagem 1 -->
            <article class="card-arte">
                <img src="https://placeholder.com" alt="Desenho 1">
                <div class="card-info">
                    <h3>Paisagem Minimalista</h3>
                    <p>Por @mariana_art</p>
                    <button class="btn-like" onclick="curtir(this)">❤️ Curtir (12)</button>
                </div>
            </article>
        </main>

    </div>

    <!-- LÓGICA DE INTERAÇÃO (JAVASCRIPT) -->
    <script>
        // Configuração da Tela de Desenho
        const canvas = document.getElementById('quadro');
        const ctx = canvas.getContext('2d');
        const corInput = document.getElementById('corPincel');
        let desenhando = false;

        ctx.lineWidth = 4;
        ctx.lineCap = 'round';

        canvas.addEventListener('mousedown', (e) => {
            desenhando = true;
            ctx.beginPath();
            ctx.moveTo(e.offsetX, e.offsetY);
        });

        canvas.addEventListener('mousemove', (e) => {
            if (!desenhando) return;
            ctx.strokeStyle = corInput.value;
            ctx.lineTo(e.offsetX, e.offsetY);
            ctx.stroke();
        });

        canvas.addEventListener('mouseup', () => desenhando = false);
        canvas.addEventListener('mouseout', () => desenhando = false);

        function limparQuadro() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        }

        // Função para postar o desenho no feed
        function postarDesenho() {
            const imagemData = canvas.toDataURL('image/png');
            const feed = document.getElementById('feedArtes');

            const novoCard = document.createElement('article');
            novoCard.className = 'card-arte';
            novoCard.innerHTML = `
                <img src="${imagemData}" alt="Novo Desenho">
                <div class="card-info">
                    <h3>Novo Rabisco</h3>
                    <p>Por @voce</p>
                    <button class="btn-like" onclick="curtir(this)">❤️ Curtir (0)</button>
                </div>
            `;

            feed.prepend(novoCard);
            limparQuadro();
        }

        // Função de curtir
        function curtir(botao) {
            let texto = botao.innerText;
            let numero = parseInt(texto.match(/\d+/)[0]);
            numero++;
            botao.innerText = `❤️ Curtir (${numero})`;
        }
    </script>

</body>
</html>
